spring:
  application:
    name: erp-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/erp}
    username: ${DB_USERNAME:erp}
    password: ${DB_PASSWORD:erp}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
      org:
        hibernate:
          envers:
            audit_table_suffix: _aud
  flyway:
    enabled: true
    locations: classpath:db/migration
  session:
    jdbc:
      initialize-schema: never

erp:
  bootstrap:
    admin:
      # Read only when no active administrator exists. No default credentials.
      email: ${ERP_BOOTSTRAP_ADMIN_EMAIL:}
      password: ${ERP_BOOTSTRAP_ADMIN_PASSWORD:}
      full-name: ${ERP_BOOTSTRAP_ADMIN_FULL_NAME:Administrador}

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /docs
